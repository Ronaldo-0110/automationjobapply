[project]
name = "ronaldo"
version = "0.1.0"
description = "Email your resume to a CSV of HR contacts with a FastAPI web app and Gmail"
readme = "README.md"
authors = [
    { name = "Sahaya Jeon Ronaldo", email = "ronaldosjr07@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ronaldo = "ronaldo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
